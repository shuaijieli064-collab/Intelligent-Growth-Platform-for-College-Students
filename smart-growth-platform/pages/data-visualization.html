/* Brand fonts — Anthropic official: Newsreader (editorial display/slogan) +
   Poppins (compact UI) + Lora (reading). Mono kept for code/token surfaces. */
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,18..72,300;0,18..72,400;0,18..72,500;1,18..72,400&family=Geist+Mono:wght@400;500&display=swap');
/* ============================================================
   Token model
   1) Primitives — 7 key color cards as 10-step scales (50→900).
      These are the single source of truth (mirrored in the linshi
      preview tool). The flagged "standard" step per group:
        brand-500 · text-800 · bg-100 · icon-700 · border-300 · success-500 · error-500
   2) Semantic tokens — reference the primitives above (no raw hex
      duplicates). These are the API consumed by preview / ui_kits /
      components.
   3) Non-color tokens — font, spacing, radius, shadow, type.
   ============================================================ */
:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --claude-background: var(--background, #ffffff);
  --claude-foreground: var(--foreground, #0f172a);
  --claude-card: var(--card, var(--background));
  --claude-card-foreground: var(--card-foreground, var(--foreground));
  --claude-popover: var(--popover, var(--card));
  --claude-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --claude-primary: var(--primary, #111827);
  --claude-primary-foreground: var(--primary-foreground, #ffffff);
  --claude-secondary: var(--secondary, var(--muted, var(--card)));
  --claude-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --claude-muted: var(--muted, var(--card));
  --claude-muted-foreground: var(--muted-foreground, var(--foreground));
  --claude-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --claude-accent-foreground: var(--accent-foreground, var(--foreground));
  --claude-destructive: var(--destructive, #ef4444);
  --claude-destructive-foreground: var(--destructive-foreground, #ffffff);
  --claude-border: var(--border, currentColor);
  --claude-input: var(--input, var(--border));
  --claude-ring: var(--ring, var(--primary));
  --claude-chart-1: var(--chart-1, var(--primary));
  --claude-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --claude-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --claude-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --claude-chart-5: var(--chart-5, var(--foreground));

/* ── Badge ─────────────────────────────────────────────────── */
/* @anatomy
   <main class="preview">
   <section class="section">
   <span class="label">Filled</span>
   <div class="row">
   <span class="badge filled">Essay</span>
   <span class="badge filled">Editorial</span>
   <span class="badge filled is-disabled" aria-disabled="true">Essay</span>
   </div>
   </section>
   <section class="section">
   <span class="label">Muted</span>
   <div class="row">
   <span class="badge muted">Editorial</span>
   <span class="badge muted is-disabled" aria-disabled="true">Essay</span>
   </div>
   </section>
   <section class="section">
   <span class="label">Outline</span>
   <div class="row">
   <span class="badge outline">Essay</span>
   <span class="badge outline">Editorial</span>
   <span class="badge outline is-disabled" aria-disabled="true">Editorial</span>
   </div>
   </section>
   </main>
*/
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(20px,3vw,32px);background:var(--background);color:var(--foreground);font-family:var(--font-serif)}
.preview{width:min(100%,760px);margin:0 auto;display:grid;gap:clamp(24px,4vw,32px)}
.section{display:grid;gap:14px}
.label{display:block;font:600 10px/1.2 var(--font-serif);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:clamp(18px,3vw,24px);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--popover);box-shadow:var(--shadow-xs)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 calc(var(--spacing)*3.5);border-radius:var(--radius);font:600 12px/1 var(--font-sans);letter-spacing:.01em;white-space:nowrap;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,color .16s ease,border-color .16s ease}
.badge:hover{transform:translateY(-1px)}
.filled{background:var(--primary);color:var(--primary-foreground);border:1px solid transparent;box-shadow:var(--shadow-xs)}
.filled:hover{box-shadow:var(--shadow-sm)}
.muted{background:var(--muted);color:var(--foreground);border:1px solid transparent}
.outline{background:var(--popover);color:var(--foreground);border:1px solid var(--border)}
.is-disabled{pointer-events:none;box-shadow:none}
.filled.is-disabled{background:var(--secondary);color:var(--muted-foreground);border-color:var(--border)}
.muted.is-disabled{background:var(--card);color:var(--muted-foreground);border-color:transparent}
.outline.is-disabled{background:var(--background);color:var(--muted-foreground)}
@media (max-width:560px){
  .row{padding:18px}
}

/* ── Button ────────────────────────────────────────────────── */
/* @anatomy
   <main class="preview">
   <section class="section">
   <span class="label">Primary</span>
   <div class="examples">
   <button class="btn primary" type="button">Start a new chat</button>
   <button class="btn primary" type="button" disabled>Start a new chat</button>
   </div>
   </section>
   <section class="section">
   <span class="label">Secondary</span>
   <div class="examples">
   <button class="btn secondary" type="button">Open design guide</button>
   <button class="btn secondary" type="button" disabled>Open design guide</button>
   </div>
   </section>
   <section class="section">
   <span class="label">Ghost</span>
   <div class="examples">
   <button class="btn ghost" type="button">Open design guide</button>
   <button class="btn ghost" type="button" disabled>Open design guide</button>
   </div>
   </section>
   </main>
*/
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(20px,3vw,32px);background:var(--background);color:var(--foreground);font:14px/1.5 var(--font-sans)}
.preview{width:min(100%,760px);margin:0 auto;display:grid;gap:clamp(24px,4vw,32px)}
.section{display:grid;gap:14px}
.label{display:block;font:600 10px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.examples{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;padding:clamp(18px,3vw,24px);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--popover);box-shadow:var(--shadow-xs)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow-sm);background:transparent;color:var(--foreground);font:600 14px/1.1 var(--font-sans);white-space:nowrap;transition:background-color .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease}
.btn:hover,.btn:focus-visible{box-shadow:var(--shadow-md)}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn:disabled{cursor:not-allowed;box-shadow:none}
.primary{background:var(--primary);color:var(--primary-foreground)}
.primary:disabled{background:var(--secondary);color:var(--muted-foreground);border-color:var(--border)}
.secondary{background:var(--secondary);color:var(--foreground);border-color:var(--border)}
.secondary:disabled{background:var(--background);color:var(--muted-foreground);border-color:var(--border)}
.ghost{background:transparent;color:var(--foreground);box-shadow:none}
.ghost:hover,.ghost:focus-visible{background:var(--muted)}
.ghost:disabled{background:transparent;color:var(--muted-foreground);border-color:transparent}
@media (max-width:560px){
  .examples{gap:10px;padding:18px}
  .btn{width:100%}
}

          <header style="position:sticky;top:0;z-index:30;height:64px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb, var(--background) 85%, transparent);border-bottom:1px solid var(--border);">

                <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--muted-foreground);flex-shrink:0;"></i>

                  <text x="660" y="380" text-anchor="middle" fill="var(--muted-foreground)" font-size="11" font-family="var(--font-sans)">7/8</text>

                  <!-- 数据结构 (bottom layer) -->
                  <path d="M60,360 L60,340 L84,335 L108,342 L132,330 L156,325 L180,332 L204,320 L228,328 L252,315 L276,310 L300,318 L324,305 L348,312 L372,300 L396,308 L420,295 L444,302 L468,290 L492,298 L516,285 L540,292 L564,280 L588,288 L612,275 L636,282 L660,270 L684,278 L708,265 L732,272 L756,260 L780,268 L780,360 Z"

                  <polyline points="60,310 84,318 108,305 132,312 156,298 180,308 204,290 228,300 252,282 276,292 300,275 324,285 348,268 372,278 396,260 420,270 444,252 468,262 492,245 516,255 540,238 564,248 588,230 612,240 636,222 660,232 684,215 708,225 732,208 756,218 780,200"

                  <polyline points="60,340 84,335 108,342 132,330 156,325 180,332 204,320 228,328 252,315 276,310 300,318 324,305 348,312 372,300 396,308 420,295 444,302 468,290 492,298 516,285 540,292 564,280 588,288 612,275 636,282 660,270 684,278 708,265 732,272 756,260 780,268"
                            fill="none" stroke="var(--chart-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>

              <!-- Stat row -->
              <div class="grid grid-cols-1 sm:grid-cols-3" style="gap:16px;margin-top:24px;">
                <div style="background:var(--background);border:1px solid var(--border);border-radius:12px;padding:16px;">
                  <p style="margin:0 0 4px;font-size:13px;color:var(--muted-foreground);white-space:nowrap;">本月总时长</p>
                  <div style="display:flex;align-items:baseline;gap:4px;">
                    <span style="font-family:var(--font-sans);font-size:24px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums;white-space:nowrap;">48.5</span>
                    <span style="font-size:14px;color:var(--muted-foreground);white-space:nowrap;">小时</span>
                  </div>
                </div>
                <div style="background:var(--background);border:1px solid var(--border);border-radius:12px;padding:16px;">

                  <div style="display:flex;align-items:baseline;gap:4px;">
                    <span style="font-family:var(--font-sans);font-size:24px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums;white-space:nowrap;">1.6</span>
                    <span style="font-size:14px;color:var(--muted-foreground);white-space:nowrap;">小时</span>

                </div>
                <div style="background:var(--background);border:1px solid var(--border);border-radius:12px;padding:16px;">

        </div>
